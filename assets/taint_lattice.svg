<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <defs>
    <linearGradient id="latticeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="12" fill="url(#latticeBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="360" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    SOVRA HARDWARE TAINT LATTICE
  </text>
  <text x="360" y="60" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
    NON-INVERTIBLE MECHANICAL TRANSITION: candidate&lt;T&gt; ➔ decision&lt;T&gt;
  </text>

  <!-- Left Box: Candidate -->
  <g transform="translate(60, 90)">
    <rect width="180" height="130" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#ef4444">0xDEAD0000</text>
    <text x="90" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e4e4e7">candidate&lt;T&gt;</text>
    <text x="90" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#a1a1aa">Bare-Metal Lock</text>
    <text x="90" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#ef4444">Execution Prohibited</text>
  </g>

  <!-- Center Arrow with Gauntlet Barrier -->
  <g transform="translate(260, 105)">
    <line x1="0" y1="50" x2="180" y2="50" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3"/>
    <polygon points="190,50 175,43 175,57" fill="#f59e0b"/>
    
    <rect x="35" y="15" width="120" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">14-GATE</text>
    <text x="95" y="52" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">BARRIER</text>
    <text x="95" y="70" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">SMT2 unsat</text>
  </g>

  <!-- Right Box: Decision -->
  <g transform="translate(470, 90)">
    <rect width="180" height="130" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#10b981">0xBEAF0000</text>
    <text x="90" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#e4e4e7">decision&lt;T&gt;</text>
    <text x="90" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#a1a1aa">Hardware Certified</text>
    <text x="90" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">Executable on Core</text>
  </g>

  <!-- Rejection / Drop Path -->
  <path d="M 355 180 L 355 240 L 260 240" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="250,240 262,235 262,245" fill="#ef4444"/>
  <text x="365" y="235" font-family="monospace" font-size="9" fill="#ef4444">Violation ➔ Quarantine / Fail Closed</text>
</svg>
