<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="deadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="beafGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="2"/>
  <rect x="20" y="20" width="920" height="440" rx="12" fill="none" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Header -->
  <text x="480" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing="1.5">
    MARS: MODEL-AGNOSTIC REASONING SUPERVISOR
  </text>
  <text x="480" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#9ca3af" letter-spacing="1">
    14-GATE SOVEREIGN BBQ FALSIFICATION GAUNTLET &amp; TRINITY CONSENSUS
  </text>

  <!-- Stage 1: Inbound Candidate -->
  <g transform="translate(40, 130)">
    <rect width="180" height="260" rx="10" fill="#1e1b2e" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="url(#deadGrad)"/>
    <text x="90" y="22" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">
      [0xDEAD0000] TAINT
    </text>
    <text x="90" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">
      Candidate Signal
    </text>
    <text x="90" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • Unverified LLM tokens
    </text>
    <text x="90" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • Untrusted input args
    </text>
    <text x="90" y="140" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • External API payloads
    </text>
    <line x1="20" y1="160" x2="160" y2="160" stroke="#374151" stroke-width="1"/>
    <rect x="25" y="180" width="130" height="30" rx="6" fill="#000000" stroke="#4b5563"/>
    <text x="90" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#ef4444">FAIL-CLOSED DEFAULT</text>
    <text x="90" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7280">Isolated Sandbox</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 230 260 L 270 260" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Stage 2: 14-Gate Gauntlet Enclave -->
  <g transform="translate(280, 110)">
    <rect width="400" height="300" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="400" height="36" rx="12" fill="url(#goldGrad)"/>
    <text x="200" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#000000">
      14-GATE FALSIFICATION GAUNTLET (BBQ)
    </text>

    <!-- Sub-grid of Gates -->
    <g transform="translate(20, 50)" font-family="monospace" font-size="10">
      <!-- Col 1 -->
      <rect x="0" y="0" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="16" fill="#10b981">G01</text><text x="40" y="16" fill="#e5e7eb">Canonical Env</text>

      <rect x="0" y="30" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="46" fill="#10b981">G02</text><text x="40" y="46" fill="#e5e7eb">Hardware Taint</text>

      <rect x="0" y="60" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="76" fill="#10b981">G03</text><text x="40" y="76" fill="#e5e7eb">Lineage Pointer</text>

      <rect x="0" y="90" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="106" fill="#10b981">G04</text><text x="40" y="106" fill="#e5e7eb">Anti-Replay Nonce</text>

      <rect x="0" y="120" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="136" fill="#10b981">G05</text><text x="40" y="136" fill="#e5e7eb">Constant-Time</text>

      <rect x="0" y="150" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="166" fill="#10b981">G06</text><text x="40" y="166" fill="#e5e7eb">Adversarial Probe</text>

      <rect x="0" y="180" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="10" y="196" fill="#f59e0b">G07</text><text x="40" y="196" fill="#fef3c7">Trinity Gate (2/3)</text>

      <!-- Col 2 -->
      <rect x="185" y="0" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="16" fill="#10b981">G08</text><text x="225" y="16" fill="#e5e7eb">Audio Hashes</text>

      <rect x="185" y="30" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="46" fill="#10b981">G09</text><text x="225" y="46" fill="#e5e7eb">Ed25519 Signatures</text>

      <rect x="185" y="60" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="76" fill="#f59e0b">G10</text><text x="225" y="76" fill="#fef3c7">Z3 SMT2 Proof (unsat)</text>

      <rect x="185" y="90" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="106" fill="#10b981">G11</text><text x="225" y="106" fill="#e5e7eb">HexCell Boundary</text>

      <rect x="185" y="120" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="136" fill="#10b981">G12</text><text x="225" y="136" fill="#e5e7eb">Zero-Pollution</text>

      <rect x="185" y="150" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="166" fill="#10b981">G13</text><text x="225" y="166" fill="#10b981">Taint Promotion</text>

      <rect x="185" y="180" width="175" height="24" rx="4" fill="#1f2937" stroke="#374151"/>
      <text x="195" y="196" fill="#10b981">G14</text><text x="225" y="196" fill="#e5e7eb">Merkle State Commit</text>
    </g>

    <!-- Trinity Council Box -->
    <rect x="20" y="260" width="360" height="28" rx="6" fill="#1f1d13" stroke="#d97706"/>
    <text x="200" y="278" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fef08a">
      Trinity Quorum: MAXX ⬡ CLARA ⬡ VANCE (2-out-of-3 Validated)
    </text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 690 260 L 730 260" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>

  <!-- Stage 3: Promoted Decision -->
  <g transform="translate(740, 130)">
    <rect width="180" height="260" rx="10" fill="#062e24" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="url(#beafGrad)"/>
    <text x="90" y="22" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">
      [0xBEAF0000] TAINT
    </text>
    <text x="90" y="65" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#34d399">
      Promoted Decision
    </text>
    <text x="90" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • Bare-metal dispatch
    </text>
    <text x="90" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • Production tool call
    </text>
    <text x="90" y="140" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9ca3af">
      • Database state commit
    </text>
    <line x1="20" y1="160" x2="160" y2="160" stroke="#374151" stroke-width="1"/>
    <rect x="25" y="180" width="130" height="30" rx="6" fill="#000000" stroke="#059669"/>
    <text x="90" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">UNSAT PROVEN</text>
    <text x="90" y="240" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ee7b7">Zero-Hallucination Safe</text>
  </g>
</svg>
